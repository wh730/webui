[pytest]
# 详细输出用例执行结果
addopts = -v -s --reruns=2 --reruns-delay=2 --alluredir=report/allure-results
# 指定pytest自动搜索用例的根目录，不用每次都写长路径
testpaths = case
# 只识别文件名以test_开头的py文件作为测试用例文件
python_files = test*.py
# 只识别类名以Test开头的测试类
python_classes = Test*
# 只识别方法名以test_开头的测试函数
python_functions = test_*
markers =
    circle: 圈子模块接口用例